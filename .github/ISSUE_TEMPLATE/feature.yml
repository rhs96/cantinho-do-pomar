name: Ideia ou funcionalidade
description: Sugira algo novo para o jogo
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Qual problema ou desejo isso resolve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Como você imagina que funcione?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
